   </g>
   <g id="text_12">
    <text style="fill: #48545e; font: 600 8.7px 'Microsoft YaHei'; text-anchor: middle" x="759.706387" y="283.631114" transform="rotate(-0 759.706387 283.631114)">old_token_logps</text>
   </g>
   <g id="text_13">
    <text style="fill: #46535e; font: 7.25px 'Microsoft YaHei'" transform="translate(706.129454 299.867361)">_make_grpo_rollout_batch 缓存</text>
    <text style="fill: #46535e; font: 7.25px 'Microsoft YaHei'" transform="translate(717.568594 308.383166)">GRPO ratio 分母；无梯度</text>
   </g>
   <g id="text_14">
    <text style="fill: #514873; font: 600 8.7px 'Microsoft YaHei'; text-anchor: middle" x="958.22298" y="283.722192" transform="rotate(-0 958.22298 283.722192)">reference log p</text>
   </g>
   <g id="text_15">
    <text style="fill: #46535e; font: 7.25px 'Microsoft YaHei'" transform="translate(909.816203 299.860564)">_reference_tokens · 固定 SFT</text>
    <text style="fill: #46535e; font: 7.25px 'Microsoft YaHei'" transform="translate(925.788293 308.376369)">KL 锚点 / DPO 对照</text>
   </g>
   <g id="text_16">
    <text style="fill: #244b69; font: 600 8.7px 'Microsoft YaHei'; text-anchor: middle" x="1156.739573" y="283.631114" transform="rotate(-0 1156.739573 283.631114)">current_token_logps</text>
   </g>
   <g id="text_17">
    <text style="fill: #46535e; font: 7.25px 'Microsoft YaHei'" transform="translate(1134.989573 299.75408)">当前策略概率</text>
    <text style="fill: #46535e; font: 7.25px 'Microsoft YaHei'" transform="translate(1134.989573 308.221173)">唯一梯度路径</text>
   </g>
   <g id="text_18">
    <text style="fill: #244b69; font: 600 10.1px 'Microsoft YaHei'; text-anchor: middle" x="352.639872" y="468.221125" transform="rotate(-0 352.639872 468.221125)">DPO / OnlineDPO</text>
   </g>
   <g id="text_19">
    <text style="fill: #46535e; font: 8.65px 'Microsoft YaHei'" transform="translate(232.646126 478.231471)">DPO: preference_features；OnlineDPO: generated_feature</text>
    <text style="fill: #46535e; font: 8.65px 'Microsoft YaHei'" transform="translate(194.891579 488.750749)">chosen/rejected 的 current / 固定 reference sequence_logps 求和 → dpo_loss</text>
    <text style="fill: #46535e; font: 8.65px 'Microsoft YaHei'" transform="translate(217.165329 498.910985)">OnlineDPO：4 个候选按 reward 取最高 / 最低；平局跳过 → 更新 πθ</text>
   </g>
   <g id="text_20">
    <text style="fill: #235a56; font: 600 9.6px 'Microsoft YaHei'; text-anchor: middle" x="958.22298" y="468.08343" transform="rotate(-0 958.22298 468.08343)">GRPO</text>
   </g>
   <g id="text_21">
    <text style="fill: #46535e; font: 8.15px 'Microsoft YaHei'" transform="translate(837.72332 478.621155)">group_advantages：每提示 4 个回答，组内标准化（eps=1e-4）</text>
    <text style="fill: #46535e; font: 8.15px 'Microsoft YaHei'" transform="translate(834.712914 488.495771)">grpo_loss：clipped ratio + current/reference KL；response 均值</text>
    <text style="fill: #46535e; font: 8.15px 'Microsoft YaHei'" transform="translate(852.823105 498.415786)">_update_grpo_groups：2 个 update epochs → 更新 πθ</text>
   </g>
   <g id="text_22">
    <text style="fill: #275a53; font: 600 10px 'Microsoft YaHei'; text-anchor: middle" x="653.63976" y="640.920965" transform="rotate(-0 653.63976 640.920965)">优化器更新 actor 参数 θ</text>
   </g>
   <g id="text_23">
    <text style="fill: #46535e; font: 8.55px 'Microsoft YaHei'; text-anchor: middle" x="653.63976" y="661.220384" transform="rotate(-0 653.63976 661.220384)">下一轮 rollout 使用更新后的策略</text>
   </g>
  </g>

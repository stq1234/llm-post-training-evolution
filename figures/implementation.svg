    <text style="fill: #4e5962; font: 600 10px 'Microsoft YaHei'; text-anchor: middle" x="1083.6396" y="126.9557" transform="rotate(-0 1083.6396 126.9557)">response_mask</text>
   </g>
   <g id="text_9">
    <text style="fill: #46535e; font: 8.55px 'Microsoft YaHei'" transform="translate(966.694303 142.233895)">src/modeling.py::_feature：prompt=0，completion含EOS</text>

   </g>
   <g id="text_10">
    <text style="fill: #2a5d55; font: 600 10px 'Microsoft YaHei'; text-anchor: middle" x="352.639872" y="284.046215" transform="rotate(-0 352.639872 284.046215)">可验证反馈</text>
   </g>
   <g id="text_11">
    <text style="fill: #46535e; font: 8.55px 'Microsoft YaHei'" transform="translate(229.020899 299.098272)">train.py::_reward → src/rewards.py::score_response(text, row)</text>

   </g>
   <g id="text_25">
    <text style="fill: #235a56; font: 600 9.2px 'Microsoft YaHei'; text-anchor: middle" x="94.176" y="254.720794" transform="rotate(-0 94.176 254.720794)">过程步骤 [22, 23]</text>

    <text style="fill: #3f4f5a; font: 8.7px 'Microsoft YaHei'; text-anchor: middle" x="295.056" y="130.397498" transform="rotate(-0 295.056 130.397498)">提示与目标回答中的词元</text>
   </g>
   <g id="text_8">
    <text style="fill: #3f4f5a; font: 8.7px 'Microsoft YaHei'; text-anchor: middle" x="567.36" y="130.397498" transform="rotate(-0 567.36 130.397498)">训练时：对示范回答进行逐词元拟合</text>
   </g>
   <g id="text_9">
    <text style="fill: #3f4f5a; font: 8.7px 'Microsoft YaHei'; text-anchor: middle" x="846.36" y="130.397498" transform="rotate(-0 846.36 130.397498)">依赖示范覆盖；学习复现目标文本，不直接表示候选之间的相对偏好。</text>
   </g>

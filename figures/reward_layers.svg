    <text style="fill: #3f4f5a; font: 8.7px 'Microsoft YaHei'; text-anchor: middle" x="295.056" y="316.675898" transform="rotate(-0 295.056 316.675898)">最终答案、程序执行结果或约束满足</text>
   </g>
   <g id="text_17">
    <text style="fill: #3f4f5a; font: 8.7px 'Microsoft YaHei'; text-anchor: middle" x="567.36" y="316.675898" transform="rotate(-0 567.36 316.675898)">完整回答后：规则、测试或 verifier 返回结果信号</text>
   </g>
   <g id="text_18">
    <text style="fill: #3f4f5a; font: 8.7px 'Microsoft YaHei'; text-anchor: middle" x="846.36" y="316.675898" transform="rotate(-0 846.36 316.675898)">常为稀疏终局反馈，且只覆盖 verifier 定义的属性；可能出现奖励投机。</text>
   </g>

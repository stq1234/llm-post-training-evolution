   <g id="text_1">
    <text style="fill: #253746; font: 700 19.3px 'Microsoft YaHei'; text-anchor: start" x="17.73" y="31.861439" transform="rotate(-0 17.73 31.861439)">后训练反馈的监督单元、信号位置与盲区</text>
   </g>
   <g id="text_2">
    <text style="fill: #5c6a75; font: 10px 'Microsoft YaHei'; text-anchor: start" x="18.846" y="49.258706" transform="rotate(-0 18.846 49.258706)">监督粒度从完整回答延伸到偏好、推理步骤、任务结果和交互轨迹；各类信号回答的问题不同。</text>
   </g>
   <g id="text_3">
    <text style="fill: #43535f; font: 600 9.5px 'Microsoft YaHei'; text-anchor: start" x="23.31" y="79.613011" transform="rotate(-0 23.31 79.613011)">反馈形式</text>
   </g>
   <g id="text_4">
    <text style="fill: #43535f; font: 600 9.5px 'Microsoft YaHei'; text-anchor: middle" x="295.056" y="79.613011" transform="rotate(-0 295.056 79.613011)">监督单元</text>
   </g>
   <g id="text_5">
    <text style="fill: #43535f; font: 600 9.5px 'Microsoft YaHei'; text-anchor: middle" x="567.36" y="79.613011" transform="rotate(-0 567.36 79.613011)">信号进入训练的位置</text>
   </g>
   <g id="text_6">
    <text style="fill: #43535f; font: 600 9.5px 'Microsoft YaHei'; text-anchor: middle" x="846.36" y="79.613011" transform="rotate(-0 846.36 79.613011)">需要留意的盲区</text>

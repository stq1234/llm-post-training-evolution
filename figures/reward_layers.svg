    <text style="fill: #3f4f5a; font: 8.7px 'Microsoft YaHei'; text-anchor: middle" x="295.056" y="378.768698" transform="rotate(-0 295.056 378.768698)">多轮状态、动作、观察与任务结果</text>
   </g>
   <g id="text_20">
    <text style="fill: #3f4f5a; font: 8.7px 'Microsoft YaHei'; text-anchor: middle" x="567.36" y="378.768698" transform="rotate(-0 567.36 378.768698)">交互中或任务结束后：工具、环境或现实结果回报</text>
   </g>
   <g id="text_21">
    <text style="fill: #3f4f5a; font: 8.7px 'Microsoft YaHei'; text-anchor: middle" x="846.36" y="378.768698" transform="rotate(-0 846.36 378.768698)">交互成本高、回报可能延迟；环境状态和评测设定也会限制外推。</text>
   </g>
   <g id="text_22">
    <text style="fill: #65727b; font: 8px 'Microsoft YaHei'; text-anchor: end" x="1002.6" y="446.212725" transform="rotate(-0 1002.6 446.212725)">各项为典型监督形式与机制性限制，不表示每项方法都采用相同实现。</text>
   </g>

    <text style="fill: #3f4f5a; font: 8.7px 'Microsoft YaHei'; text-anchor: middle" x="567.36" y="254.583098" transform="rotate(-0 567.36 254.583098)">生成过程中：局部判断进入 PRM 或逐步奖励</text>
   </g>
   <g id="text_15">
    <text style="fill: #3f4f5a; font: 8.7px 'Microsoft YaHei'; text-anchor: middle" x="846.36" y="254.583098" transform="rotate(-0 846.36 254.583098)">步骤标签可能有噪声；局部看似合理不保证整条推理最终正确。</text>

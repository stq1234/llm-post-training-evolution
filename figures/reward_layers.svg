   <g id="text_10">
    <text style="fill: #3f4f5a; font: 8.7px 'Microsoft YaHei'; text-anchor: middle" x="295.056" y="192.626236" transform="rotate(-0 295.056 192.626236)">同一提示下的回答对 (chosen, rejected)</text>
   </g>
   <g id="text_11">
    <text style="fill: #3f4f5a; font: 8.7px 'Microsoft YaHei'; text-anchor: middle" x="567.36" y="192.490298" transform="rotate(-0 567.36 192.490298)">候选回答完成后：提供比较标签或偏好排序</text>
   </g>
   <g id="text_12">
    <text style="fill: #3f4f5a; font: 8.7px 'Microsoft YaHei'; text-anchor: middle" x="846.36" y="192.490298" transform="rotate(-0 846.36 192.490298)">提供相对次序而非逐步修正；会受标注一致性与评判器偏差影响。</text>
   </g>
